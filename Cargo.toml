[package]
name = "lunr"
version = "0.1.0"
authors = ["Oliver Nightingale <oliver.nightingale1@gmail.com>"]
edition = "2021"

[dependencies]
serde = "1.0"
serde_json = "1.0"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "stemmer"
harness = false

[[bench]]
name = "builder"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "query_parser"
harness = false

[[bench]]
name = "token_set"
harness = false

[[bench]]
name = "vector"
harness = false

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
strip = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
